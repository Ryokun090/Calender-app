<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>通知 - SukiMatch</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.notif { display: block; position: relative; border-radius: 10px; padding: 18px 24px 18px 28px; margin-bottom: 14px; background: var(--sm-blue-bg); }
.notif.green { background: var(--sm-green-bg); }
.notif.orange { background: var(--sm-orange-bg); }
.notif.purple { background: var(--sm-purple-bg); }
.notif:hover { filter: brightness(.97); }
.notif .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.notif .msg { font-size: 13px; font-weight: 700; word-break: break-word; }
.notif .time { font-size: 10px; color: var(--sm-sub); white-space: nowrap; margin-top: 2px; }
.notif.read { opacity: .6; }
.notif.read .msg { font-weight: 500; }
.notif .dot { position: absolute; left: 12px; top: 24px; width: 8px; height: 8px; border-radius: 4px; background: #eb5966; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="sm-page">
    <div class="sm-head">
        <h1 class="sm-title lg">通知</h1>
    </div>

    <div class="sm-card" style="padding:24px">
        <p class="sm-muted" th:if="${#lists.isEmpty(notifications)}" style="margin:8px 0">通知はありません。</p>

        <a th:each="n : ${notifications}" class="notif"
           th:classappend="${(n.type == 'poll_confirmed' ? 'green' : (n.type == 'invite_joined' or n.type == 'reminder' ? 'purple' : '')) + (n.read ? ' read' : '')}"
           th:href="@{/notifications/{id}/open(id=${n.id})}">
            <span class="dot" th:if="${!n.read}"></span>
            <div class="top">
                <div class="msg" th:text="${n.message}">通知メッセージ</div>
                <div class="time" th:text="${#temporals.format(n.createdAt, 'yyyy/MM/dd HH:mm')}">2026/09/20 19:00</div>
            </div>
        </a>
    </div>
</div>
</body>
</html>
