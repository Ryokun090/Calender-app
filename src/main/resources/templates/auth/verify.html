<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>2段階認証 - 共有カレンダーアプリ</title>
</head>
<body>
<div style="max-width:360px;margin:60px auto;padding:24px;border:1px solid #ddd;border-radius:12px;">
    <h1 style="text-align:center;font-size:16px;">2段階認証</h1>
    <p style="text-align:center;font-size:13px;color:#555;">メールアドレスに届いた6桁の認証コードを入力してください</p>

    <p th:if="${error}" th:text="${error}" style="color:red;font-size:13px;"></p>
    <p th:if="${resent}" style="color:green;font-size:13px;">認証コードを再送信しました</p>

    <form th:action="@{/auth/verify}" method="post">
        <div>
            <label>認証コード</label><br/>
            <input type="text" name="code" inputmode="numeric" maxlength="6" required
                   style="width:100%;text-align:center;letter-spacing:4px;font-size:18px;">
        </div>
        <button type="submit" style="width:100%;margin-top:16px;">認証する</button>
    </form>

    <form th:action="@{/auth/verify/resend}" method="post" style="margin-top:12px;">
        <button type="submit" style="width:100%;background:none;border:none;color:#357;text-decoration:underline;cursor:pointer;">
            認証コードを再送信
        </button>
    </form>

    <p style="text-align:center;margin-top:16px;">
        <a th:href="@{/auth/login}">ログイン画面へ戻る</a>
    </p>
</div>
</body>
</html>
