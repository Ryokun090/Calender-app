<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録 - SukiMatch</title>
    <th:block th:replace="~{fragments/base :: css}"></th:block>
</head>
<body class="sm-auth">
<div class="sm-auth-wrap" style="padding-top:54px">
    <h1 class="sm-brand" style="font-size:28px">SukiMatch</h1>
    <p class="sm-brand-sub" style="font-size:15px">アカウントを作成</p>

    <form class="sm-auth-form" style="margin-top:36px" th:action="@{/auth/signup}" th:object="${signupForm}" method="post">
        <div class="sm-field">
            <label class="sm-label" for="name">ニックネーム</label>
            <input class="sm-input" type="text" th:field="*{name}" placeholder="みんなに表示する名前">
            <p class="sm-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="sm-field">
            <label class="sm-label" for="email">メールアドレス</label>
            <input class="sm-input" type="email" th:field="*{email}" placeholder="メールアドレスを入力">
            <p class="sm-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div class="sm-field">
            <label class="sm-label" for="password">パスワード</label>
            <input class="sm-input" type="password" th:field="*{password}" placeholder="8文字以上">
            <p class="sm-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="sm-field">
            <label class="sm-label" for="passwordConfirm">パスワード確認</label>
            <input class="sm-input" type="password" th:field="*{passwordConfirm}" placeholder="もう一度入力">
            <p class="sm-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
        </div>
        <div style="text-align:center;margin-top:24px">
            <button type="submit" class="sm-btn dark tall" style="min-width:220px">アカウントを作成</button>
        </div>
    </form>

    <div class="sm-auth-links" style="margin-top:24px">
        <a class="sm-link" th:href="@{/auth/login}">すでにアカウントをお持ちですか？ ログイン</a>
    </div>
</div>
</body>
</html>
