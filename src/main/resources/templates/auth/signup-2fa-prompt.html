<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>2段階認証の設定 - 共有カレンダーアプリ</title>
</head>
<body>
<div style="max-width:360px;margin:60px auto;padding:24px;border:1px solid #ddd;border-radius:12px;">
    <h1 style="text-align:center;font-size:16px;">登録ありがとうございます</h1>
    <p style="text-align:center;font-size:13px;color:#555;line-height:1.6;">
        2段階認証を設定すると、ログイン時にメールで届く認証コードの入力が必要になり、
        より安全にアカウントを利用できます。あとから設定で変更することもできます。
    </p>

    <form th:action="@{/auth/signup/2fa-prompt/enable}" method="post">
        <button type="submit" style="width:100%;margin-top:8px;">2段階認証を設定する</button>
    </form>

    <form th:action="@{/auth/signup/2fa-prompt/skip}" method="post" style="margin-top:8px;">
        <button type="submit" style="width:100%;background:none;border:1px solid #ccc;">
            あとで設定する
        </button>
    </form>
</div>
</body>
</html>
