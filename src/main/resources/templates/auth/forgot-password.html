<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワードの再設定 - SukiMatch</title>
    <th:block th:replace="~{fragments/base :: css}"></th:block>
</head>
<body class="sm-auth">
<div class="sm-auth-wrap">
    <h1 class="sm-brand">SukiMatch</h1>
    <h2 class="sm-auth-title">パスワードの再設定</h2>

    <div class="sm-auth-form" style="margin-top:32px">
        <th:block th:if="${sent}">
            <p class="sm-alert ok">
                ご入力のメールアドレスが登録されている場合、再設定用のリンクをお送りしました。メールをご確認ください(有効期限は30分です)。
            </p>
            <p class="sm-muted" style="line-height:1.8">
                メールが届かないときは、迷惑メールフォルダを確認するか、1分ほど待ってからもう一度お試しください。
            </p>
        </th:block>

        <form th:unless="${sent}" th:action="@{/auth/password/forgot}" method="post">
            <p class="sm-muted" style="line-height:1.8;margin:0 0 20px">
                登録したメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。
            </p>
            <div class="sm-field">
                <label class="sm-label" for="email">メールアドレス</label>
                <input class="sm-input" id="email" type="email" name="email" required autofocus placeholder="メールアドレスを入力">
            </div>
            <div style="text-align:center;margin-top:24px">
                <button type="submit" class="sm-btn dark tall" style="min-width:156px">リンクを送る</button>
            </div>
        </form>
    </div>

    <div class="sm-auth-links">
        <a class="sm-link" style="font-size:12px" th:href="@{/auth/login}">ログイン画面に戻る</a>
    </div>
</div>
</body>
</html>
