<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - SukiMatch</title>
    <th:block th:replace="~{fragments/base :: css}"></th:block>
</head>
<body class="sm-auth">
<div class="sm-auth-wrap">
    <h1 class="sm-brand">SukiMatch</h1>
    <p class="sm-brand-sub">みんなの予定を、もっと簡単に。</p>

    <div class="sm-auth-form">
        <p class="sm-alert error" th:if="${param.error}">メールアドレスまたはパスワードが違います</p>
        <p class="sm-alert ok" th:if="${param.logout}">ログアウトしました</p>
        <p class="sm-alert ok" th:if="${param.registered}">登録が完了しました。ログインしてください</p>
        <p class="sm-alert ok" th:if="${param.reset}">パスワードを変更しました。新しいパスワードでログインしてください</p>

        <form th:action="@{/auth/login}" method="post">
            <div class="sm-field">
                <label class="sm-label" for="username">メールアドレス</label>
                <input class="sm-input" id="username" type="email" name="username" required autofocus placeholder="メールアドレスを入力">
            </div>
            <div class="sm-field">
                <label class="sm-label" for="password">パスワード</label>
                <input class="sm-input" id="password" type="password" name="password" required placeholder="パスワードを入力">
            </div>
            <div style="text-align:right;margin-top:-6px">
                <a class="sm-link" th:href="@{/auth/password/forgot}">パスワードを忘れた方</a>
            </div>
            <div style="text-align:center;margin-top:24px">
                <button type="submit" class="sm-btn dark tall" style="min-width:156px">ログイン</button>
            </div>
        </form>
    </div>

    <div class="sm-auth-links">
        <span class="plain">アカウントをお持ちでない方は</span>
        <a class="sm-link" style="font-size:12px" th:href="@{/auth/signup}">新規登録</a>
    </div>
</div>
</body>
</html>
