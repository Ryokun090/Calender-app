<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - SukiMatch</title>
</head>
<body>
<div style="max-width:360px;margin:60px auto;padding:24px;border:1px solid #ddd;border-radius:12px;">
    <h1 style="text-align:center;font-size:18px;">SukiMatch</h1>

    <p th:if="${param.error}" style="color:red;">メールアドレスまたはパスワードが違います</p>
    <p th:if="${param.logout}" style="color:green;">ログアウトしました</p>
    <p th:if="${param.registered}" style="color:green;">登録が完了しました。ログインしてください</p>

    <form th:action="@{/auth/login}" method="post">
        <div>
            <label>メールアドレス</label><br/>
            <input type="email" name="username" required style="width:100%;">
        </div>
        <div style="margin-top:8px;">
            <label>パスワード</label><br/>
            <input type="password" name="password" required style="width:100%;">
        </div>
        <button type="submit" style="width:100%;margin-top:16px;">ログイン</button>
    </form>

    <p style="text-align:center;margin-top:16px;">
        アカウントをお持ちでない方は <a th:href="@{/auth/signup}">新規登録</a>
    </p>
</div>
</body>
</html>
