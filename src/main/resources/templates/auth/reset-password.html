<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新しいパスワードの設定 - SukiMatch</title>
    <th:block th:replace="~{fragments/base :: css}"></th:block>
</head>
<body class="sm-auth">
<div class="sm-auth-wrap">
    <h1 class="sm-brand">SukiMatch</h1>
    <h2 class="sm-auth-title">新しいパスワードの設定</h2>

    <div class="sm-auth-form" style="margin-top:32px">
        <th:block th:if="${invalid}">
            <p class="sm-alert error">このリンクは無効か、有効期限が切れています。</p>
            <div style="text-align:center;margin-top:24px">
                <a class="sm-btn dark tall" style="min-width:156px" th:href="@{/auth/password/forgot}">もう一度やり直す</a>
            </div>
        </th:block>

        <form th:unless="${invalid}" th:action="@{/auth/password/reset}" method="post">
            <p class="sm-alert error" th:if="${problem}" th:text="${problem}">エラー</p>
            <input type="hidden" name="token" th:value="${token}">
            <div class="sm-field">
                <label class="sm-label" for="password">新しいパスワード(8文字以上)</label>
                <input class="sm-input" id="password" type="password" name="password" required minlength="8" autofocus placeholder="新しいパスワードを入力">
            </div>
            <div class="sm-field">
                <label class="sm-label" for="passwordConfirm">新しいパスワード(確認)</label>
                <input class="sm-input" id="passwordConfirm" type="password" name="passwordConfirm" required minlength="8" placeholder="もう一度入力">
            </div>
            <div style="text-align:center;margin-top:24px">
                <button type="submit" class="sm-btn dark tall" style="min-width:156px">パスワードを変更する</button>
            </div>
        </form>
    </div>

    <div class="sm-auth-links">
        <a class="sm-link" style="font-size:12px" th:href="@{/auth/login}">ログイン画面に戻る</a>
    </div>
</div>
</body>
</html>
