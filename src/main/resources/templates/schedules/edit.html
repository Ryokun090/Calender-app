<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>予定を編集 - SukiMatch</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.time-row { display: flex; align-items: center; gap: 10px; }
.time-row .sep { color: var(--sm-sub); font-size: 12px; }
.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="sm-page narrow">
  <a class="sm-back" th:href="@{/schedules/{id}(id=${schedule.id})}">&larr; 予定に戻る</a>
  <div class="sm-card">
    <h1 class="sm-title">予定を編集</h1>
    <p class="sm-muted" style="margin:6px 0 0">※ 日をまたぐ予定(例: 23:00〜翌1:00)は、日ごとに分けて登録してください(「23:00〜23:59」と、翌日の「0:00〜1:00」)。</p>

    <form style="margin-top:28px;max-width:560px" th:action="@{/schedules/{id}(id=${schedule.id})}" th:object="${editScheduleForm}" method="post">

      <div class="sm-field">
        <label class="sm-label" for="title">予定名</label>
        <input class="sm-input" type="text" th:field="*{title}">
        <div class="sm-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>

      <div class="sm-field">
        <label class="sm-label" for="date">日付</label>
        <input class="sm-input" type="date" th:field="*{date}">
        <div class="sm-error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
      </div>

      <div class="sm-field">
        <label class="sm-label">時刻</label>
        <div class="time-row">
          <input class="sm-input" type="time" th:field="*{startTime}">
          <span class="sep">〜</span>
          <input class="sm-input" type="time" th:field="*{endTime}">
        </div>
        <div class="sm-error"
             th:if="${#fields.hasErrors('startTime')} or ${#fields.hasErrors('endTime')} or ${#fields.hasErrors('timeRangeValid')}">
          時刻を確認してください
        </div>
      </div>

      <div class="sm-field">
        <label class="sm-label" for="location">場所(任意)</label>
        <input class="sm-input" type="text" th:field="*{location}">
      </div>

      <div class="sm-field">
        <label class="sm-label" for="description">説明(任意)</label>
        <textarea class="sm-textarea" th:field="*{description}"></textarea>
      </div>

      <div class="form-foot">
        <a class="sm-btn" th:href="@{/schedules/{id}(id=${schedule.id})}">キャンセル</a>
        <button type="submit" class="sm-btn dark tall" style="min-width:160px">更新する</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
