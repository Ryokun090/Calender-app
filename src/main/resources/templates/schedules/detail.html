<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${schedule.title} + ' - SukiMatch'">予定詳細</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.when { font-size: 14px; font-weight: 500; margin: 22px 0 0; }
.field-k { font-size: 11px; color: var(--sm-sub); margin: 22px 0 4px; }
.field-v { font-size: 13px; font-weight: 500; white-space: pre-wrap; word-break: break-word; }
.comment { background: var(--sm-bg); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
.comment .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; color: var(--sm-sub); margin-bottom: 4px; }
.comment .body { font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.comment-form { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; }
.comment-form textarea { flex: 1; height: 44px; min-height: 44px; padding: 12px 14px; }
.actions { display: flex; gap: 8px; }
.actions form { margin: 0; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="sm-page narrow">
  <a class="sm-back" th:href="@{/calendars/{id}(id=${schedule.calendarId})}">&larr; カレンダーに戻る</a>

  <div class="sm-card">
    <div class="sm-head" style="margin-bottom:0">
      <h1 class="sm-title" th:text="${schedule.title}">サークル活動</h1>
      <div class="actions">
        <a class="sm-btn sm" th:href="@{/schedules/{id}/edit(id=${schedule.id})}">編集</a>
        <form th:action="@{/schedules/{id}/delete(id=${schedule.id})}" method="post" onsubmit="return confirm('この予定を削除しますか？');">
          <button type="submit" class="sm-btn sm danger">削除</button>
        </form>
      </div>
    </div>

    <p class="when"
       th:text="${#temporals.format(schedule.startTime, 'yyyy年M月d日')} + ' ' + ${#temporals.format(schedule.startTime, 'HH:mm')} + '〜' + ${#temporals.format(schedule.endTime, 'HH:mm')}">2026年10月10日 18:00〜20:00</p>

    <th:block th:if="${schedule.location != null and !#strings.isEmpty(schedule.location)}">
      <div class="field-k">場所</div>
      <div class="field-v" th:text="${schedule.location}">KCS北九州</div>
    </th:block>

    <th:block th:if="${schedule.description != null and !#strings.isEmpty(schedule.description)}">
      <div class="field-k">説明</div>
      <div class="field-v" th:text="${schedule.description}">説明</div>
    </th:block>

    <hr class="sm-hr" style="margin-top:32px">

    <h2 class="sm-h2">コメント</h2>

    <p class="sm-muted" th:if="${#lists.isEmpty(comments)}">まだコメントはありません。</p>

    <div class="comment" th:each="c : ${comments}">
      <div class="meta">
        <span th:text="${c.authorName}">投稿者</span>
        <span th:text="${#temporals.format(c.createdAt, 'M/d HH:mm')}">9/20 19:00</span>
      </div>
      <div class="body" th:text="${c.content}">コメント本文</div>
    </div>

    <form class="comment-form" th:action="@{/schedules/{id}/comments(id=${schedule.id})}" method="post">
      <textarea class="sm-textarea" name="content" maxlength="500" required placeholder="コメントを入力..."></textarea>
      <button type="submit" class="sm-btn dark tall" style="min-width:108px">送信</button>
    </form>
  </div>
</div>
</body>
</html>
