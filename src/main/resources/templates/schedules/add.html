<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>予定を追加 - SukiMatch</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.entry-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--sm-bg); border: 1px solid var(--sm-line); border-radius: 7px; padding: 8px 14px; margin-bottom: 10px; }
.entry-row .entry-label { font-size: 11px; color: var(--sm-sub); width: 48px; flex: none; }
.entry-row input { height: 34px; width: auto; flex: 0 1 auto; }
.entry-row input[type=date] { min-width: 150px; }
.entry-row .sep { color: var(--sm-sub); font-size: 12px; }
.entry-row .remove-entry { margin-left: auto; }
.entry-row .entry-err { flex-basis: 100%; }
.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="sm-page narrow">
  <div class="sm-card">
    <h1 class="sm-title">予定を追加</h1>
    <p class="sm-sub">複数の日程をまとめて登録できます</p>
    <p class="sm-muted" style="margin:6px 0 0">※ 日をまたぐ予定(例: 23:00〜翌1:00)は、日ごとに分けて登録してください(「23:00〜23:59」と、翌日の「0:00〜1:00」)。</p>

    <form id="scheduleForm" style="margin-top:28px" th:action="@{/calendars/{id}/schedules(id=${calendar.id})}"
          th:object="${createScheduleForm}" method="post">

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label">対象カレンダー</label>
        <input class="sm-input" type="text" th:value="${calendar.name}" disabled>
      </div>

      <div class="sm-field" style="max-width:560px" th:if="${templates != null and !#lists.isEmpty(templates)}">
        <label class="sm-label" for="templateSelect">過去の予定から選ぶ(任意)</label>
        <select class="sm-select" id="templateSelect">
          <option value="">選択しない</option>
          <option th:each="t : ${templates}"
                  th:text="${t.label}"
                  th:attr="data-title=${t.title},data-location=${t.location},data-description=${t.description}">サークル飲み会</option>
        </select>
        <div class="sm-muted" style="margin-top:4px;font-size:11px">タイトル・場所・説明が入力されます。日付と時間は入れ直してください。</div>
      </div>

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label" for="title">予定名</label>
        <input class="sm-input" type="text" th:field="*{title}" placeholder="例：サークル活動">
        <div class="sm-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label" for="location">場所(任意)</label>
        <input class="sm-input" type="text" th:field="*{location}" placeholder="例：KCS北九州">
      </div>

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label" for="description">説明(任意)</label>
        <textarea class="sm-textarea" th:field="*{description}" placeholder="持ち物や集合場所など"></textarea>
      </div>

      <h2 class="sm-h3" style="margin-top:32px">候補日程</h2>
      <div class="sm-error" th:if="${#fields.hasErrors('entries')}" th:errors="*{entries}" style="margin-bottom:8px"></div>

      <div id="entryList">
        <div class="entry-row" th:each="entry, status : *{entries}">
          <span class="entry-label" th:text="'日程 ' + (${status.index} + 1)">日程 1</span>
          <input class="sm-input" type="date" th:field="*{entries[__${status.index}__].date}">
          <input class="sm-input" type="time" th:field="*{entries[__${status.index}__].startTime}">
          <span class="sep">〜</span>
          <input class="sm-input" type="time" th:field="*{entries[__${status.index}__].endTime}">
          <button type="button" class="sm-link-btn remove-entry">削除</button>
          <div class="sm-error entry-err" th:if="${#fields.hasErrors('entries[__${status.index}__].date')}"
               th:errors="*{entries[__${status.index}__].date}"></div>
          <div class="sm-error entry-err"
               th:if="${#fields.hasErrors('entries[__${status.index}__].startTime')} or ${#fields.hasErrors('entries[__${status.index}__].endTime')} or ${#fields.hasErrors('entries[__${status.index}__].timeRangeValid')}">
            時刻を確認してください
          </div>
        </div>
      </div>

      <!-- JSで行を追加するときのテンプレート(送信はされない) -->
      <template id="entryTemplate">
        <div class="entry-row">
          <span class="entry-label">日程</span>
          <input class="sm-input entry-date" type="date">
          <input class="sm-input entry-start" type="time" value="19:00">
          <span class="sep">〜</span>
          <input class="sm-input entry-end" type="time" value="21:00">
          <button type="button" class="sm-link-btn remove-entry">削除</button>
        </div>
      </template>

      <div class="form-foot">
        <button type="button" id="addEntryButton" class="sm-btn">＋ 日程を追加</button>
        <button type="submit" class="sm-btn dark tall" style="min-width:180px">まとめて登録</button>
      </div>
    </form>
  </div>
</div>

<script th:inline="none">
(function () {
  // 過去の予定から選ぶ: タイトル・場所・説明を入力欄にコピーする(日付・時刻は触らない)
  var templateSelect = document.getElementById('templateSelect');
  if (templateSelect) {
    templateSelect.addEventListener('change', function () {
      var option = templateSelect.options[templateSelect.selectedIndex];
      if (!option.value && option.dataset.title === undefined) {
        return; // 「選択しない」
      }
      document.getElementById('title').value = option.dataset.title || '';
      document.getElementById('location').value = option.dataset.location || '';
      document.getElementById('description').value = option.dataset.description || '';
    });
  }
})();

(function () {
  var entryList = document.getElementById('entryList');
  var template = document.getElementById('entryTemplate');
  var addButton = document.getElementById('addEntryButton');

  // 既存行の数からスタートして、インデックスがサーバー側のバインドと衝突しないようにする
  var nextIndex = entryList.querySelectorAll('.entry-row').length;

  function renumberLabels() {
    var rows = entryList.querySelectorAll('.entry-row');
    rows.forEach(function (row, i) {
      var label = row.querySelector('span');
      if (label) {
        label.textContent = '日程 ' + (i + 1);
      }
    });
  }

  addButton.addEventListener('click', function () {
    var clone = template.content.cloneNode(true);
    var row = clone.querySelector('.entry-row');

    var dateInput = clone.querySelector('.entry-date');
    dateInput.setAttribute('name', 'entries[' + nextIndex + '].date');

    var startInput = clone.querySelector('.entry-start');
    startInput.setAttribute('name', 'entries[' + nextIndex + '].startTime');

    var endInput = clone.querySelector('.entry-end');
    endInput.setAttribute('name', 'entries[' + nextIndex + '].endTime');

    entryList.appendChild(row);
    nextIndex++;
    renumberLabels();
  });

  entryList.addEventListener('click', function (event) {
    if (event.target.classList.contains('remove-entry')) {
      var rows = entryList.querySelectorAll('.entry-row');
      if (rows.length <= 1) {
        return; // 最低1件は残す
      }
      event.target.closest('.entry-row').remove();
      renumberLabels();
    }
  });
})();
</script>

</body>
</html>
