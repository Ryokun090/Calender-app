<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${poll.title} + ' - 空き日程調整'">空き日程調整</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.cand { background: var(--sm-bg); border: 1px solid var(--sm-line); border-radius: 9px; padding: 16px 20px; margin-bottom: 12px; }
.cand .when { font-size: 14px; font-weight: 700; }
.cand .time { font-size: 12px; color: var(--sm-sub); margin: 2px 0 12px; }
.cand .votes { display: flex; gap: 10px; flex-wrap: wrap; }
.vote { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--sm-line); background: #fff; font-size: 12px; font-weight: 500; cursor: pointer; user-select: none; }
.vote input { position: absolute; opacity: 0; pointer-events: none; }
.vote:hover { background: #f1f4f9; }
.vote.yes-selected, .vote.yes:has(input:checked) { background: var(--sm-green-bg); border-color: var(--sm-green); color: #1f7a50; }
.vote.no-selected, .vote.no:has(input:checked) { background: var(--sm-danger-bg); border-color: var(--sm-danger); color: var(--sm-danger); }
.cand .count { font-size: 11px; color: var(--sm-sub); margin-top: 10px; }
.confirm-row { display: flex; align-items: center; gap: 16px; background: var(--sm-green-bg); border-radius: 9px; padding: 14px 20px; margin-bottom: 12px; }
.confirm-row .w { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; }
.confirm-row .n { font-size: 13px; font-weight: 700; color: var(--sm-green); }
.confirm-row form { margin: 0; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="sm-page narrow">
  <a class="sm-back" th:href="@{/calendars/{id}/free-slots(id=${poll.calendarId})}">&larr; 空き日程の一覧に戻る</a>

  <div class="sm-card">
    <div class="sm-head" style="margin-bottom:8px">
      <h1 class="sm-title" th:text="${poll.title}">タイトル</h1>
      <span class="sm-chip" th:classappend="${poll.status == 'confirmed'} ? 'green'" th:text="${poll.status == 'open'} ? '回答受付中' : '予定確定'">回答受付中</span>
    </div>
    <p class="sm-sub" style="margin:0" th:if="${poll.location != null and !#strings.isEmpty(poll.location)}" th:text="'場所:' + ${poll.location}">場所</p>
    <p class="sm-sub" th:text="'メンバー ' + ${totalMembers} + '人中'">メンバー数</p>

    <hr class="sm-hr">

    <div class="sm-alert ok" th:if="${poll.status == 'confirmed'}">
      この候補日程は確定済みです。
      <a th:if="${poll.confirmedScheduleId != null}" th:href="@{/schedules/{id}(id=${poll.confirmedScheduleId})}" class="sm-link" style="font-size:12px">確定した予定を見る</a>
      <span th:if="${poll.confirmedScheduleId == null}" class="sm-muted">(確定した予定は削除されました)</span>
    </div>

    <form th:if="${poll.status == 'open'}" th:action="@{/polls/{id}/responses(id=${poll.id})}" method="post">
      <h2 class="sm-h3">候補日</h2>
      <div class="cand" th:each="c : ${candidates}">
        <div class="when" th:text="${#temporals.format(c.startTime, 'M月d日(E)')}">9月20日(日)</div>
        <div class="time" th:text="${#temporals.format(c.startTime, 'HH:mm')} + '〜' + ${#temporals.format(c.endTime, 'HH:mm')}">19:00〜21:00</div>
        <div class="votes">
          <label class="vote yes" th:classappend="${c.myResponseYes} ? 'yes-selected'">
            <input type="radio" th:name="'responses[' + ${c.candidateId} + ']'" value="yes" th:checked="${c.myResponseYes}">
            ○ 参加できる
          </label>
          <label class="vote no" th:classappend="${c.myResponseNo} ? 'no-selected'">
            <input type="radio" th:name="'responses[' + ${c.candidateId} + ']'" value="no" th:checked="${c.myResponseNo}">
            × 参加できない
          </label>
        </div>
        <div class="count" th:text="'○ ' + ${c.yesCount} + '人 / × ' + ${c.noCount} + '人'">○0人 / ×0人</div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:20px">
        <button type="submit" class="sm-btn dark tall" style="min-width:160px">回答を保存</button>
      </div>
    </form>

    <div th:if="${poll.status == 'open' and canConfirm}" style="margin-top:32px;padding-top:24px;border-top:1px solid var(--sm-line)">
      <h2 class="sm-h3">この候補で確定する(作成者・管理者のみ)</h2>
      <div class="confirm-row" th:each="c : ${candidates}">
        <span class="w" th:text="${#temporals.format(c.startTime, 'M月d日(E) HH:mm')} + '〜' + ${#temporals.format(c.endTime, 'HH:mm')}">候補</span>
        <span class="n" th:text="'○ ' + ${c.yesCount} + '人'">○0人</span>
        <form th:action="@{/polls/{id}/confirm(id=${poll.id})}" method="post">
          <input type="hidden" name="candidateId" th:value="${c.candidateId}">
          <button type="submit" class="sm-btn dark">この日程を確定</button>
        </form>
      </div>
    </div>

    <p class="sm-muted" th:if="${#lists.isEmpty(candidates)}">候補日程がありません。</p>
  </div>
</div>
</body>
</html>
