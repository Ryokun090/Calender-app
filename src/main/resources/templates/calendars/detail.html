<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${calendar.name} + ' - SukiMatch'">カレンダー</title>
    <th:block th:replace="~{fragments/base :: css}"></th:block>
    <style>
        .cal-shell { display: flex; min-height: calc(100vh - 72px); }
        .cal-side { width: 248px; flex: none; background: #fff; border-right: 1px solid var(--sm-line); padding: 24px; }
        .cal-main { flex: 1; min-width: 0; padding: 30px 32px 48px; }

        /* 左サイドバー */
        .cal-create { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: var(--sm-text); color: #fff; font-size: 12px; font-weight: 500; }
        .cal-create:hover { background: #2a2f38; }
        .mini-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; }
        .mini-title { font-size: 13px; font-weight: 500; }
        .mini-nav a { display: inline-block; width: 22px; text-align: center; font-size: 16px; color: var(--sm-sub); }
        .mini-nav a:hover { color: var(--sm-text); }
        .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; text-align: center; font-size: 10px; font-weight: 500; }
        .mini-grid .dow { color: var(--sm-sub); height: 22px; line-height: 22px; }
        .mini-grid .d { height: 24px; line-height: 24px; }
        .mini-grid .d.today span { display: inline-block; min-width: 26px; height: 24px; line-height: 24px; border-radius: 12px; background: var(--sm-blue); color: #fff; }
        .side-hr { border: none; border-top: 1px solid var(--sm-line); margin: 22px 0; }
        .side-h { font-size: 12px; font-weight: 700; margin: 0 0 12px; }
        .side-cal { display: flex; align-items: center; gap: 10px; padding: 6px 2px; font-size: 11px; color: var(--sm-sub); }
        .side-cal:hover { color: var(--sm-text); }
        .side-cal.current { color: var(--sm-text); font-weight: 700; }
        .side-cal i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
        .side-add { display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 500; color: var(--sm-blue); }
        .side-none { font-size: 11px; color: var(--sm-sub); padding: 2px; }

        /* 月表示 */
        .cal-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
        .cal-month { font-size: 24px; font-weight: 700; margin: 0 14px 0 0; }
        .cal-today { height: 36px; padding: 0 22px; border: 1px solid var(--sm-line); border-radius: 8px; background: #fff; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; }
        .cal-today:hover { background: #f1f4f9; }
        .cal-arrow { font-size: 22px; color: var(--sm-sub); width: 30px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; }
        .cal-arrow:hover { background: #f1f4f9; color: var(--sm-text); }
        .cal-name { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 14px; background: #fff; border: 1px solid var(--sm-line); font-size: 11px; font-weight: 500; max-width: 220px; }
        .cal-name i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
        .cal-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cal-jump { margin-left: auto; display: flex; align-items: center; gap: 6px; }
        .cal-jump input { height: 36px; width: auto; padding: 0 10px; }
        .cal-jump .sm-btn { height: 36px; padding: 0 14px; }

        .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: -6px 0 14px; font-size: 11px; color: var(--sm-sub); }
        .cal-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
        .cal-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
        .cal-card { background: var(--sm-line); border: 1px solid var(--sm-line); border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; }
        .cal-dow { background: #fff; text-align: center; font-size: 11px; font-weight: 500; color: var(--sm-sub); padding: 12px 0; }
        .cal-cell { background: #fff; min-height: 96px; padding: 8px 10px; min-width: 0; }
        .cal-cell.blank { background: #fbfcfd; }
        .cal-num { font-size: 10px; font-weight: 500; color: var(--sm-sub); height: 20px; line-height: 20px; margin-bottom: 4px; }
        .cal-cell.today .cal-num span { display: inline-block; min-width: 26px; height: 20px; padding: 0 6px; text-align: center; border-radius: 10px; background: var(--sm-blue); color: #fff; }
        .cal-chip { display: block; height: 22px; line-height: 22px; padding: 0 8px; margin-bottom: 4px; border-radius: 5px; color: #fff; font-size: 9px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .cal-chip:hover { filter: brightness(.94); }

        @media (max-width: 900px) {
            .cal-shell { display: block; }
            .cal-side { width: auto; border-right: none; border-bottom: 1px solid var(--sm-line); padding: 14px; }
            /* スマホでは、ミニカレンダーとカレンダー一覧は☰メニューに任せる */
            .mini-head, .mini-grid, .side-hr, .side-h, .side-cal, .side-add { display: none; }
            .cal-main { padding: 20px 14px 40px; }
            .cal-cell { min-height: 64px; padding: 4px; }
            .cal-jump { margin-left: 0; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="cal-shell">

    <!-- 左サイドバー -->
    <aside class="cal-side">
        <a class="cal-create" th:href="@{/calendars/{id}/schedules/add(id=${calendar.id})}">＋ 予定を作成</a>

        <div class="mini-head">
            <span class="mini-title" th:text="${yearMonth.year} + '年' + ${yearMonth.monthValue} + '月'">2026年10月</span>
            <span class="mini-nav">
                <a th:href="@{/calendars/{id}(id=${calendar.id}, year=${yearMonth.minusMonths(1).year}, month=${yearMonth.minusMonths(1).monthValue})}" aria-label="前の月">&lsaquo;</a>
                <a th:href="@{/calendars/{id}(id=${calendar.id}, year=${yearMonth.plusMonths(1).year}, month=${yearMonth.plusMonths(1).monthValue})}" aria-label="次の月">&rsaquo;</a>
            </span>
        </div>
        <div class="mini-grid">
            <div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div><div class="dow">日</div>
            <th:block th:each="idx : ${#numbers.sequence(0, cells.size() - 1)}">
                <div class="d" th:with="dayNum=${cells.get(idx)}" th:classappend="${dayNum != 0 and dayNum == todayDay ? 'today' : ''}">
                    <span th:if="${dayNum != 0}" th:text="${dayNum}">1</span>
                </div>
            </th:block>
        </div>

        <hr class="side-hr">

        <div class="side-h">マイカレンダー</div>
        <th:block th:each="m : ${menuCalendars}" th:if="${m.personal}">
            <a class="side-cal" th:classappend="${m.id == calendar.id} ? 'current'" th:href="@{/calendars/{id}(id=${m.id})}">
                <i th:style="'background:' + ${m.color}"></i><span th:text="${m.name}">自分の予定</span>
            </a>
        </th:block>

        <div class="side-h" style="margin-top:26px">共有カレンダー</div>
        <th:block th:each="m : ${menuCalendars}" th:if="${!m.personal}">
            <a class="side-cal" th:classappend="${m.id == calendar.id} ? 'current'" th:href="@{/calendars/{id}(id=${m.id})}">
                <i th:style="'background:' + ${m.color}"></i><span th:text="${m.name}">サークル</span>
            </a>
        </th:block>
        <a class="side-add" th:href="@{/calendars/add}">＋ カレンダーを追加</a>
    </aside>

    <!-- 月表示 -->
    <main class="cal-main">
        <div class="sm-alert" th:if="${message}" th:text="${message}">メッセージ</div>
        <div class="cal-toolbar">
            <h1 class="cal-month" th:text="${yearMonth.year} + '年' + ${yearMonth.monthValue} + '月'">2026年10月</h1>
            <a class="cal-today" th:href="@{/calendars/{id}(id=${calendar.id})}">今日</a>
            <span>
                <a class="cal-arrow" th:href="@{/calendars/{id}(id=${calendar.id}, year=${yearMonth.minusMonths(1).year}, month=${yearMonth.minusMonths(1).monthValue})}" aria-label="前の月">&lsaquo;</a><a class="cal-arrow" th:href="@{/calendars/{id}(id=${calendar.id}, year=${yearMonth.plusMonths(1).year}, month=${yearMonth.plusMonths(1).monthValue})}" aria-label="次の月">&rsaquo;</a>
            </span>
            <span class="cal-name"><i th:style="'background:' + ${calendarColor}"></i><span th:text="${calendar.name}">カレンダー名</span></span>

            <form class="cal-jump" method="get" th:action="@{/calendars/{id}(id=${calendar.id})}">
                <input class="sm-input" type="month" name="ym" th:value="${#temporals.format(yearMonth.atDay(1), 'yyyy-MM')}" required>
                <button class="sm-btn" type="submit">移動</button>
            </form>
        </div>

        <!-- 色の凡例(予定の色 = 作った人) -->
        <div class="cal-legend" th:if="${members.size() > 1}">
            <span class="lg" th:each="m : ${members}"><i th:style="'background:' + ${userColors.get(m.userId)}"></i><span th:text="${m.name}">名前</span></span>
        </div>

        <div class="cal-card">
            <div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow">土</div><div class="cal-dow">日</div>
            <th:block th:each="idx : ${#numbers.sequence(0, cells.size() - 1)}">
                <div class="cal-cell" th:with="dayNum=${cells.get(idx)}"
                     th:classappend="${dayNum == 0 ? 'blank' : (dayNum == todayDay ? 'today' : '')}">
                    <th:block th:if="${dayNum != 0}">
                        <div class="cal-num"><span th:text="${dayNum}">1</span></div>
                        <a class="cal-chip" th:each="s : ${schedulesByDay.get(dayNum)}"
                           th:href="@{/schedules/{id}(id=${s.id})}" th:style="'background:' + ${userColors.get(s.createdBy) ?: calendarColor}"
                           th:title="${s.title}" th:text="${s.title}">予定</a>
                    </th:block>
                </div>
            </th:block>
        </div>
    </main>
</div>
</body>
</html>
