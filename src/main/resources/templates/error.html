<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>エラー - SukiMatch</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.err-wrap { max-width: 560px; margin: 0 auto; padding: 72px 24px; text-align: center; }
.err-code { font-size: 64px; font-weight: 700; line-height: 1; color: var(--sm-brand); margin: 0; letter-spacing: 2px; }
.err-title { font-size: 20px; font-weight: 700; margin: 20px 0 8px; }
.err-desc { font-size: 13px; color: var(--sm-sub); margin: 0 0 32px; line-height: 1.8; }
.err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="err-wrap">
  <p class="err-code" th:text="${status != null} ? ${status} : 'エラー'">404</p>

  <th:block th:switch="${status}">
    <th:block th:case="404">
      <h1 class="err-title">ページが見つかりません</h1>
      <p class="err-desc">URLが間違っているか、ページが削除された可能性があります。</p>
    </th:block>
    <th:block th:case="403">
      <h1 class="err-title">このページは開けません</h1>
      <p class="err-desc">参加していないカレンダーや、権限のない操作の可能性があります。</p>
    </th:block>
    <th:block th:case="400">
      <h1 class="err-title">リクエストを処理できませんでした</h1>
      <p class="err-desc">入力内容を確認して、もう一度お試しください。</p>
    </th:block>
    <th:block th:case="*">
      <h1 class="err-title">エラーが発生しました</h1>
      <p class="err-desc">時間をおいてもう一度お試しください。何度も出る場合は、管理者に連絡してください。</p>
    </th:block>
  </th:block>

  <div class="err-actions">
    <a class="sm-btn dark tall" th:href="@{/calendars}" style="min-width:180px">カレンダーに戻る</a>
    <a class="sm-btn tall" href="javascript:history.back()">前のページへ戻る</a>
  </div>
</div>
</body>
</html>
