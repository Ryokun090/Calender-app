<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  全画面で共通のスタイル(Figma「SukiMatch」の色・角丸・ボタン・入力欄)。
  使い方: 各画面の<head>の中に次の1行を入れる。
    <th:block th:replace="~{fragments/base :: css}"></th:block>
  ※別ファイル(.css)にせず、HTMLの部品にしているのは、ログイン画面などSecurityConfigで
    静的ファイルを許可していない画面でも確実にスタイルが効くようにするため。
-->
<th:block th:fragment="css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --sm-bg: #f8fafc;
  --sm-surface: #ffffff;
  --sm-line: #dee3eb;
  --sm-text: #14171c;
  --sm-sub: #616975;
  --sm-blue: #3885f5;
  --sm-blue-bg: #e8f2ff;
  --sm-brand: #4f7af5;
  --sm-green: #2ea36e;
  --sm-green-bg: #e5f7ed;
  --sm-orange: #eb8c2e;
  --sm-orange-bg: #fff2e0;
  --sm-purple: #7a63e0;
  --sm-purple-bg: #f0ebff;
  --sm-danger: #d64047;
  --sm-danger-bg: #fdeced;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--sm-bg);
  color: var(--sm-text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }

/* ページの幅 */
.sm-page { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
.sm-page.narrow { max-width: 820px; }
.sm-page.wide { max-width: 1280px; }

/* カード */
.sm-card { background: var(--sm-surface); border: 1px solid var(--sm-line); border-radius: 12px; padding: 32px; }
.sm-grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .sm-grid-2 { grid-template-columns: 1fr; } .sm-card { padding: 22px; } }

/* 見出し */
.sm-title { font-size: 24px; font-weight: 700; line-height: 1.35; margin: 0; word-break: break-word; }
.sm-title.lg { font-size: 25px; }
.sm-sub { font-size: 12px; color: var(--sm-sub); margin: 8px 0 0; }
.sm-h2 { font-size: 14px; font-weight: 700; margin: 0 0 12px; }
.sm-h3 { font-size: 13px; font-weight: 700; margin: 0 0 12px; }
.sm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sm-hr { border: none; border-top: 1px solid var(--sm-line); margin: 24px 0; }
.sm-muted { color: var(--sm-sub); font-size: 12px; }
.sm-back { display: inline-block; font-size: 12px; color: var(--sm-sub); margin-bottom: 16px; }
.sm-back:hover { color: var(--sm-text); }

/* ボタン */
.sm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 40px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--sm-line);
  background: var(--sm-surface); color: var(--sm-text);
  font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.sm-btn:hover { background: #f1f4f9; }
.sm-btn.dark { background: var(--sm-text); border-color: var(--sm-text); color: #fff; }
.sm-btn.dark:hover { background: #2a2f38; }
.sm-btn.brand { background: var(--sm-brand); border-color: var(--sm-brand); color: #fff; font-weight: 700; }
.sm-btn.brand:hover { background: #3f68e0; }
.sm-btn.danger { color: var(--sm-danger); }
.sm-btn.danger:hover { background: var(--sm-danger-bg); }
.sm-btn.block { width: 100%; }
.sm-btn.tall { height: 44px; }
.sm-btn.sm { height: 32px; padding: 0 12px; font-size: 11px; }
.sm-link-btn { background: none; border: none; padding: 0; font: inherit; font-size: 11px; font-weight: 500; color: var(--sm-danger); cursor: pointer; }
.sm-link-btn:hover { text-decoration: underline; }
.sm-link { font-size: 11px; font-weight: 500; color: var(--sm-blue); }
.sm-link:hover { text-decoration: underline; }

/* 入力欄 */
.sm-field { margin-bottom: 18px; }
.sm-label { display: block; font-size: 11px; font-weight: 500; margin: 0 0 6px; color: var(--sm-text); }
.sm-input, .sm-select, .sm-textarea {
  display: block; width: 100%; height: 42px; padding: 0 13px; border: 1px solid var(--sm-line); border-radius: 7px;
  background: var(--sm-surface); color: var(--sm-text); font: inherit; font-size: 12px;
}
.sm-textarea { height: 96px; padding: 11px 13px; resize: vertical; }
.sm-input::placeholder, .sm-textarea::placeholder { color: var(--sm-sub); }
.sm-input:focus, .sm-select:focus, .sm-textarea:focus { outline: none; border-color: var(--sm-blue); box-shadow: 0 0 0 3px var(--sm-blue-bg); }
.sm-input:disabled { background: var(--sm-bg); color: var(--sm-sub); }
.sm-error { font-size: 11px; color: var(--sm-danger); margin-top: 4px; }

/* メッセージ */
.sm-alert { background: var(--sm-blue-bg); border-radius: 8px; padding: 12px 14px; font-size: 12px; margin-bottom: 18px; }
.sm-alert.error { background: var(--sm-danger-bg); color: var(--sm-danger); }
.sm-alert.ok { background: var(--sm-green-bg); color: #1f7a50; }

/* バッジ(丸いラベル) */
.sm-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 14px; border-radius: 14px; font-size: 11px; font-weight: 500; background: var(--sm-blue-bg); color: var(--sm-blue); }
.sm-chip.green { background: var(--sm-green-bg); color: var(--sm-green); }
.sm-chip.orange { background: var(--sm-orange-bg); color: var(--sm-orange); }
.sm-chip.purple { background: var(--sm-purple-bg); color: var(--sm-purple); }

/* 行(メンバー・候補日程など) */
.sm-row { display: flex; align-items: center; gap: 12px; background: var(--sm-bg); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
.sm-row.line { border: 1px solid var(--sm-line); border-radius: 7px; }
.sm-row .grow { flex: 1; min-width: 0; }
.sm-avatar { width: 32px; height: 32px; border-radius: 16px; background: var(--sm-blue-bg); color: var(--sm-blue); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.sm-dot { width: 14px; height: 14px; border-radius: 7px; background: var(--sm-green); flex: none; }

/* 認証系(ログイン・登録・2段階認証)の中央カラム */
body.sm-auth { background: var(--sm-surface); }
.sm-auth-wrap { max-width: 380px; margin: 0 auto; padding: 60px 20px 80px; }
.sm-brand { text-align: center; font-size: 30px; font-weight: 700; margin: 0; line-height: 1.4; }
.sm-brand-sub { text-align: center; font-size: 13px; color: var(--sm-sub); margin: 8px 0 0; }
.sm-auth-title { text-align: center; font-size: 20px; font-weight: 700; margin: 28px 0 0; }
.sm-auth-form { margin-top: 44px; }
.sm-auth-links { text-align: center; margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
.sm-auth-links .plain { font-size: 11px; color: var(--sm-sub); }
</style>
</th:block>
</body>
</html>
