<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>空き日程を調整 - SukiMatch</title>
<th:block th:replace="~{fragments/base :: css}"></th:block>
<style>
.entry-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--sm-bg); border: 1px solid var(--sm-line); border-radius: 7px; padding: 8px 14px; margin-bottom: 10px; }
.entry-row .entry-label { font-size: 11px; color: var(--sm-sub); width: 48px; flex: none; }
.entry-row input { height: 34px; width: auto; flex: 0 1 auto; }
.entry-row input[type=date] { min-width: 150px; }
.entry-row .sep { color: var(--sm-sub); font-size: 12px; }
.entry-row .remove-entry { margin-left: auto; }
.entry-row .entry-err { flex-basis: 100%; }
.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="sm-page narrow">
  <a class="sm-back" th:href="@{/calendars/{id}/free-slots(id=${calendar.id})}">&larr; 空き日程の一覧に戻る</a>
  <div class="sm-card">
    <h1 class="sm-title">空き日程を調整</h1>
    <p class="sm-sub">複数の日程候補を出して、メンバーに○×で回答してもらいます</p>

    <form id="pollForm" style="margin-top:28px" th:action="@{/calendars/{id}/free-slots(id=${calendar.id})}"
          th:object="${createPollForm}" method="post">

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label" for="title">予定名</label>
        <input class="sm-input" type="text" th:field="*{title}" placeholder="例：忘年会">
        <div class="sm-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label" for="location">場所(任意)</label>
        <input class="sm-input" type="text" th:field="*{location}" placeholder="例：KCS北九州">
      </div>

      <div class="sm-field" style="max-width:560px">
        <label class="sm-label" for="description">説明(任意)</label>
        <textarea class="sm-textarea" th:field="*{description}"></textarea>
      </div>

      <h2 class="sm-h3" style="margin-top:32px">候補日程</h2>
      <div class="sm-error" th:if="${#fields.hasErrors('candidates')}" th:errors="*{candidates}" style="margin-bottom:8px"></div>

      <div id="entryList">
        <div class="entry-row" th:each="entry, status : *{candidates}">
          <span class="entry-label" th:text="'候補 ' + (${status.index} + 1)">候補 1</span>
          <input class="sm-input" type="date" th:field="*{candidates[__${status.index}__].date}">
          <input class="sm-input" type="time" th:field="*{candidates[__${status.index}__].startTime}">
          <span class="sep">〜</span>
          <input class="sm-input" type="time" th:field="*{candidates[__${status.index}__].endTime}">
          <button type="button" class="sm-link-btn remove-entry">削除</button>
          <div class="sm-error entry-err" th:if="${#fields.hasErrors('candidates[__${status.index}__].date')}"
               th:errors="*{candidates[__${status.index}__].date}"></div>
        </div>
      </div>

      <template id="entryTemplate">
        <div class="entry-row">
          <span class="entry-label">候補</span>
          <input class="sm-input entry-date" type="date">
          <input class="sm-input entry-start" type="time" value="19:00">
          <span class="sep">〜</span>
          <input class="sm-input entry-end" type="time" value="21:00">
          <button type="button" class="sm-link-btn remove-entry">削除</button>
        </div>
      </template>

      <div class="form-foot">
        <button type="button" id="addEntryButton" class="sm-btn">＋ 候補を追加</button>
        <button type="submit" class="sm-btn dark tall" style="min-width:180px">候補を作成</button>
      </div>
    </form>
  </div>
</div>

<script th:inline="none">
(function () {
  var entryList = document.getElementById('entryList');
  var template = document.getElementById('entryTemplate');
  var addButton = document.getElementById('addEntryButton');
  var nextIndex = entryList.querySelectorAll('.entry-row').length;

  function renumberLabels() {
    entryList.querySelectorAll('.entry-row').forEach(function (row, i) {
      var label = row.querySelector('span');
      if (label) {
        label.textContent = '候補 ' + (i + 1);
      }
    });
  }

  addButton.addEventListener('click', function () {
    var clone = template.content.cloneNode(true);
    var row = clone.querySelector('.entry-row');

    clone.querySelector('.entry-date').setAttribute('name', 'candidates[' + nextIndex + '].date');
    clone.querySelector('.entry-start').setAttribute('name', 'candidates[' + nextIndex + '].startTime');
    clone.querySelector('.entry-end').setAttribute('name', 'candidates[' + nextIndex + '].endTime');

    entryList.appendChild(row);
    nextIndex++;
    renumberLabels();
  });

  entryList.addEventListener('click', function (event) {
    if (event.target.classList.contains('remove-entry')) {
      if (entryList.querySelectorAll('.entry-row').length <= 1) {
        return;
      }
      event.target.closest('.entry-row').remove();
      renumberLabels();
    }
  });
})();
</script>

</body>
</html>
